# ============================================================
# 校园二手交易平台 —— Nginx 站点配置
# 放置路径：/etc/nginx/conf.d/secondhand.conf
#
# 为什么是 8091 而不是 80：
#   80 已被 /etc/nginx/conf.d/campus.conf 占用，且它的 server_name 是 `_`
#   （catch-all）。用 IP 访问时 Host 就是那个 IP，所有 server_name _ 的站点
#   都会抢同一个端口，只有在**不同端口**上才能并存。
#   8080 = 在线简历、8090 = 医疗安全问答、80 = 校园综合服务平台，
#   所以本站在 8091。
#
# 端口分工：
#   8091（Nginx，公网）  → 前端 dist + 反代 /api
#   ↳ 8081（Spring Boot，仅 127.0.0.1）
#   ↳ 8010（FastAPI，仅 127.0.0.1，由 Spring Boot 调用，Nginx 不直接碰）
# ============================================================

server {
    listen 8091;
    server_name _;

    root /opt/secondhand/frontend/dist;
    index index.html;

    # 商品图上传：后端限制 10MB，这里给到 12MB 留点余量，
    # 否则 Nginx 会先拦下来返回 413，而后端日志里什么都看不到
    client_max_body_size 12m;

    access_log /var/log/nginx/secondhand.access.log;
    error_log  /var/log/nginx/secondhand.error.log;

    # ---- 前端（Vue SPA）----
    # history 路由必须回落 index.html，否则刷新 /orders 这类子路由直接 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物改一次名字就变，可以长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html 绝不能缓存，否则发版后用户还拿着旧的资源引用
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # ---- SSE：智能客服流式接口（必须单独列出）----
    # 必须关缓冲，否则 Nginx 会把增量攒成一坨，前端「打字机效果」整个消失，
    # 表现为「等十几秒，然后整段蹦出来」。
    # proxy_read_timeout 要给够：LLM 上游单次调用可能几十秒。
    location /api/ai/chat/stream {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
        proxy_set_header Connection '';

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- 后端业务接口 ----
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 普通接口 120s 足够（AI 类接口前端自己设了 120s 超时，要能覆盖住）
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---- 商品图片上传目录 ----
    # 由 Spring Boot 的 ResourceHandler 提供（Demo1Application 里映射到
    # UploadPaths.dir()），所以依旧反代到后端，不要直接 alias 到文件系统 ——
    # 两处解析路径的规则一旦不一致，就会出现「上传成功但图片 404」。
    location /uploads/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
    }
}
