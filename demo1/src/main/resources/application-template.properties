# 复制本文件为 application.properties 后再填自己的值：
#   cp application-template.properties application.properties
#
# 注意：值一律留空、说明写在注释里。
# 直接把「你的密码」写成值，会让 MySQL 握手时报 latin-1 编码错误，
# 报错信息与真实原因完全脱节。
spring.application.name=demo1

# ---- 数据库（必填）----
# 库名 secondhand 要先手动建：Hibernate 只建表、不建库
spring.datasource.url=jdbc:mysql://localhost:3306/secondhand?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=
spring.datasource.password=

# ---- JPA ----
# update：保留历史数据，重启不清空。演示期间不要改成 create-drop（会清库）
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ---- 上传 ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- AI 服务地址（Python 侧，默认 8000）----
ai.service.url=http://localhost:8000
