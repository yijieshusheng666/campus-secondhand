# 复制本文件为 application.properties 后再填自己的值：
#   cp application-template.properties application.properties
#
# 注意：值一律留空、说明写在注释里。
# 直接把「你的密码」写成值，会让 MySQL 握手时报 latin-1 编码错误，
# 报错信息与真实原因完全脱节。
spring.application.name=demo1

# ---- 数据库（必填）----
# 库名 secondhand 要先手动建：Hibernate 只建表、不建库
spring.datasource.url=jdbc:mysql://localhost:3306/secondhand?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=
spring.datasource.password=

# ---- JPA ----
# update：保留历史数据，重启不清空。演示期间不要改成 create-drop（会清库）
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ---- 上传 ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- AI 服务地址（Python 侧，默认 8000）----
# ⚠️ 必须写 127.0.0.1，不要写 localhost：后者在部分环境会解析成 ::1，
# 表现为「时好时坏的连接被拒」，排查起来非常费劲（application.properties 里记过这个坑）。
ai.service.url=http://127.0.0.1:8000

# ---- 鉴权 ----
# 登录令牌的 HMAC 签名密钥。留空也能启动（会随机生成一个并打 WARN），
# 但那样后端每次重启都会让所有已登录用户掉线；演示前建议填一个固定值。
# 改动这个值 = 让所有已签发的令牌立即失效。
app.auth.secret=
# 令牌有效期（秒），默认 7 天
app.auth.ttl-seconds=604800

# ---- CORS ----
# 逗号分隔的允许来源，默认只放本机 Vite dev server。
# 写成 * 等于允许任意站点跨域调用本服务所有接口。
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
